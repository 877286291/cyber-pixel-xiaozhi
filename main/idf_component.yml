## 应用组件的托管依赖清单（IDF Component Manager）。
##
## 为什么放在 main 而不是 components/bsp：
##   - bsp 是硬件复用层，Opus 与 WebSocket 是应用级协议栈，不属于板级逻辑；
##   - 依赖由真正引用它们的代码所在组件声明，换应用时可以连同 main 一起替换。
##
## 版本全部精确钉住（与 bsp/idf_component.yml 同一要求）：这些库的 API 与内存行为
## 会随版本变化，而本板没有 PSRAM、堆预算很紧，升级必须是主动决定而不是被动漂移。
dependencies:
  idf:
    version: ">=5.5.3,<5.6.0"
  # WebSocket 传输。小智对话通道走 wss，用它承载控制消息与 Opus 二进制帧。
  espressif/esp_websocket_client: "^1.8.0"
  # Opus 编解码。选 78/esp-opus 是因为它就是小智参考实现的同一份移植，
  # 服务端下发的音频即 Opus 帧，用同源实现能少一层兼容风险。
  # 代价：约 60-80 KB flash 加数十 KB RAM（见 docs/reference 的音频压缩实测记录）。
  78/esp-opus: "^1.0.5"
